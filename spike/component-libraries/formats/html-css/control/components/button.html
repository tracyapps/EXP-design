<!-- Button — simple. Variants: .exp-button--primary|--secondary|--ghost, --s|--m|--l, disabled -->

<button type="button" class="exp-button exp-button--secondary exp-button--s">Compare plans</button>
<button type="button" class="exp-button exp-button--ghost exp-button--l">Learn more</button>
<button type="button" class="exp-button exp-button--primary exp-button--m" disabled>Sold out</button>
