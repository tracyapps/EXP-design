<!-- Card — composite: contains Button components in .exp-card__actions -->
<article class="exp-card exp-card--raised">
  <p class="exp-card__eyebrow">Service</p>
  <h3 class="exp-card__title">Garden design</h3>
  <p class="exp-card__body">A planting plan drawn for your light, soil and budget.</p>
  <div class="exp-card__actions">
    <button type="button" class="exp-button exp-button--primary exp-button--m">Book a visit</button>
    <button type="button" class="exp-button exp-button--ghost exp-button--m">Details</button>
  </div>
</article>
<article class="exp-card exp-card--plain">
  <h3 class="exp-card__title">Seasonal care</h3>
  <p class="exp-card__body">Four visits a year to prune, feed and refresh.</p>
  <div class="exp-card__actions">
    <button type="button" class="exp-button exp-button--secondary exp-button--s">Add to plan</button>
  </div>
</article>
