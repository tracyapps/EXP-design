<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Component preview</title>
  <style>
    /* Host-page chrome only. Component styles come from the copy being shown. */
    html { background: var(--exp-color-bg, Canvas); color: var(--exp-color-text, CanvasText); }
    body { margin: 0; padding: 1rem; font: 0.8125rem/1.4 system-ui, sans-serif; }
    .demos { display: flex; flex-wrap: wrap; gap: 1.25rem 1.5rem; align-items: flex-start; }
    figure { margin: 0; display: grid; gap: 0.5rem; justify-items: start; }
    figure.wide { flex: 1 1 100%; }
    figcaption { color: var(--exp-color-muted, GrayText); font-family: ui-monospace, Menlo, monospace; font-size: 0.75rem; }
    .error { padding: 0.75rem; border: 2px solid #b4441b; border-radius: 0.375rem; background: #fff4ef; color: #5c1f08; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <div class="demos" id="demos" aria-live="off"></div>
  </main>
  <script type="module" src="preview.js"></script>
</body>
</html>
