<!-- @dsCard group="Components" viewport="700x230" name="Inputs" subtitle="Text, numeric, select, color well — the inspector field kit" -->
<!DOCTYPE html>
<html lang="en" class="exp-dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin:0; background:var(--surface-window); font-family:var(--font-sans); padding:22px; }
  .grid { display:grid; grid-template-columns:74px 1fr; gap:14px 12px; align-items:center; max-width:420px; }
  .cap { font-family:var(--font-mono); font-size:10px; color:var(--text-tertiary); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { TextField, NumericField, Select, ColorWell } = window.EXPDesignDesignSystem_fb82b2;
function Demo() {
  const [name, setName] = React.useState("Ellipse");
  const [x,setX]=React.useState(307),[y,setY]=React.useState(383);
  const [w,setW]=React.useState(100),[h,setH]=React.useState(100);
  const [op,setOp]=React.useState(100);
  const [blend,setBlend]=React.useState("Normal");
  return (
    <div className="grid">
      <span className="cap">name</span>
      <TextField value={name} onChange={setName} weight="medium" />
      <span className="cap">X · Y</span>
      <div style={{display:"flex",gap:8}}><NumericField label="X" value={x} onChange={setX}/><NumericField label="Y" value={y} onChange={setY}/></div>
      <span className="cap">W · H</span>
      <div style={{display:"flex",gap:8}}><NumericField label="W" value={w} onChange={setW}/><NumericField label="H" value={h} onChange={setH}/></div>
      <span className="cap">R · opacity</span>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <NumericField label="R" value={0} unit="°" onChange={()=>{}} width={64}/>
        <NumericField label="" value={op} unit="%" min={0} max={100} onChange={setOp} width={56}/>
      </div>
      <span className="cap">blend</span>
      <Select options={["Normal","Multiply","Screen","Overlay","Soft Light","Difference"]} value={blend} onChange={setBlend} width={150}/>
      <span className="cap">fill · stroke</span>
      <div style={{display:"flex",gap:18}}>
        <ColorWell label="Fill" color="#d9d9de" />
        <ColorWell label="Stroke" color="#000000" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
