<!DOCTYPE html>
<html lang="en" class="exp-dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin:0; background:var(--surface-window); font-family:var(--font-sans); padding:26px; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:22px; }
  .cap { font-family:var(--font-mono); font-size:10px; color:var(--text-tertiary); width:74px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Badge, Tooltip, IconButton } = window.EXPDesignDesignSystem_fb82b2;
function Demo() {
  return (
    <div>
      <div className="row"><span className="cap">badges</span>
        <Badge>8 layers</Badge>
        <Badge tone="accent">Component</Badge>
        <Badge tone="brand" dot>Live</Badge>
        <Badge tone="red" dot>3 errors</Badge>
        <Badge tone="neutral">290 × 328</Badge>
      </div>
      <div className="row"><span className="cap">tooltips</span>
        <Tooltip label="Select" shortcut="V" side="bottom"><IconButton icon="cursor" size="lg" active title="Select"/></Tooltip>
        <Tooltip label="Pen" shortcut="P" side="bottom"><IconButton icon="pen-nib" size="lg" title="Pen"/></Tooltip>
        <Tooltip label="Zoom to Fit" shortcut="⇧1" side="bottom"><IconButton icon="corners-out" size="lg" title="Fit"/></Tooltip>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
