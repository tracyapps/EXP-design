<!-- @dsCard group="Type" viewport="700x280" name="Scale" subtitle="10 → 64px; chrome lives at 10–15px" -->
<!DOCTYPE html>
<html lang="en" class="exp-dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-window); padding:22px;
         font-family:var(--font-display); }
  .r { display:flex; align-items:baseline; gap:16px; padding:3px 0; }
  .r .s { color:var(--text-primary); font-weight:var(--w-light); flex:1;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .r .l { font-family:var(--font-mono); font-size:10px; color:var(--text-tertiary); width:120px; }
</style>
</head>
<body>
  <div class="r"><div class="s" style="font-size:64px;font-weight:var(--w-ultralight)">Display</div><div class="l">64 / display</div></div>
  <div class="r"><div class="s" style="font-size:40px">Heading</div><div class="l">40 / 3xl</div></div>
  <div class="r"><div class="s" style="font-size:28px">Subhead</div><div class="l">28 / 2xl</div></div>
  <div class="r"><div class="s" style="font-size:18px">Prominent</div><div class="l">18 / lg</div></div>
  <div class="r"><div class="s" style="font-size:15px">Document name</div><div class="l">15 / md</div></div>
  <div class="r"><div class="s" style="font-size:13px">Panel / body</div><div class="l">13 / base</div></div>
  <div class="r"><div class="s" style="font-size:12px">Label / form</div><div class="l">12 / small</div></div>
  <div class="r"><div class="s" style="font-size:11px">Section title</div><div class="l">11 / mini</div></div>
  <div class="r"><div class="s" style="font-size:10px">Micro caption</div><div class="l">10 / micro</div></div>
</body>
</html>
