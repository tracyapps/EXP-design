<!-- @dsCard group="Type" viewport="700x300" name="Chrome roles" subtitle="The named text roles, exactly as the app uses them" -->
<!DOCTYPE html>
<html lang="en" class="exp-dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-window); padding:22px; }
  .r { display:flex; align-items:center; gap:16px; padding:6px 0;
       border-bottom:1px solid var(--hairline); }
  .r:last-child { border-bottom:none; }
  .r .spec { flex:1; }
  .r .l { font-family:var(--font-mono); font-size:9.5px; color:var(--text-tertiary);
          width:230px; text-align:right; }
</style>
</head>
<body>
  <div class="r"><div class="spec exp-doc-name" style="font-size:15px">awesome document #5<span style="color:var(--text-tertiary)">.design</span></div><div class="l">doc name · SF light 15</div></div>
  <div class="r"><div class="spec exp-panel-title">LAYERS</div><div class="l">panel title · SF reg 13 caps</div></div>
  <div class="r"><div class="spec exp-section-title">Effects</div><div class="l">section · SF ultralight 11</div></div>
  <div class="r"><div class="spec" style="font-family:var(--font-sans);font-size:12px;font-weight:var(--w-medium);color:var(--text-primary)">Artboard name</div><div class="l">artboard · SF medium 12</div></div>
  <div class="r"><div class="spec exp-layer-name">another long layer name</div><div class="l">layer · SF Compact light 12</div></div>
  <div class="r"><div class="spec exp-label">Opacity</div><div class="l">label · SF light 12 / 60%</div></div>
  <div class="r"><div class="spec exp-numeric">100 %</div><div class="l">numeric · SF mono digits</div></div>
</body>
</html>
