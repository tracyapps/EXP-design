<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="2 · 4 · 6 · 8 · 12 · 16 · 24 · 32 — note the 6 and 12" -->
<!DOCTYPE html>
<html lang="en" class="exp-dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-window); padding:24px;
         display:flex; gap:18px; align-items:flex-end; font-family:var(--font-mono); }
  .u { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .bar { background:var(--accent); border-radius:2px; height:48px; }
  .u .v { font-size:10px; color:var(--text-secondary); }
</style>
</head>
<body>
  <div class="u"><div class="bar" style="width:2px"></div><div class="v">2</div></div>
  <div class="u"><div class="bar" style="width:4px"></div><div class="v">4</div></div>
  <div class="u"><div class="bar" style="width:6px"></div><div class="v">6</div></div>
  <div class="u"><div class="bar" style="width:8px"></div><div class="v">8</div></div>
  <div class="u"><div class="bar" style="width:12px"></div><div class="v">12</div></div>
  <div class="u"><div class="bar" style="width:16px"></div><div class="v">16</div></div>
  <div class="u"><div class="bar" style="width:24px"></div><div class="v">24</div></div>
  <div class="u"><div class="bar" style="width:32px"></div><div class="v">32</div></div>
</body>
</html>
