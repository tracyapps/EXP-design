<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="drop 4 · field 5 · row/card/tool 6 · control 7 · button 8 · panel 12" -->
<!DOCTYPE html>
<html lang="en" class="exp-dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-window); padding:24px;
         display:flex; gap:18px; align-items:flex-end; font-family:var(--font-mono); }
  .u { display:flex; flex-direction:column; align-items:center; gap:8px; flex:1; }
  .box { width:100%; height:60px; background:var(--n-300);
         border:1px solid var(--border-strong); border-bottom:none; }
  .u .v { font-size:10px; color:var(--text-secondary); }
</style>
</head>
<body>
  <div class="u"><div class="box" style="border-radius:4px 4px 0 0">·</div><div class="v">4 drop</div></div>
  <div class="u"><div class="box" style="border-radius:5px 5px 0 0">·</div><div class="v">5 field</div></div>
  <div class="u"><div class="box" style="border-radius:6px 6px 0 0">·</div><div class="v">6 row</div></div>
  <div class="u"><div class="box" style="border-radius:7px 7px 0 0">·</div><div class="v">7 control</div></div>
  <div class="u"><div class="box" style="border-radius:8px 8px 0 0">·</div><div class="v">8 button</div></div>
  <div class="u"><div class="box" style="border-radius:12px 12px 0 0">·</div><div class="v">12 panel</div></div>
</body>
</html>
